<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اهواز | ۱۳۳۵ و امروز</title><link rel="stylesheet" href="vendor/leaflet.css">
